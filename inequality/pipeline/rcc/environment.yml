# Python dependencies for the pipeline's RCC stages. Consumed by the
# container build (pyciam.def), which also bakes in the vendored pyCIAM
# and rhg-compute-tools; see rcc/README.md. rhg-compute-tools is not in a
# pip block here because it needs --no-deps, and conda-env treats every
# pip line as a requirement, so flags fail the build.
name: pyciam
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - xarray
  - zarr
  - dask
  - distributed
  - scipy
  - scikit-learn
  - pint
  - pint-xarray
  - cloudpathlib
  # the module-level import closure of rhg_compute_tools.xarray (installed
  # --no-deps in the container): its utils module imports git and toolz.
  # toolz arrives with dask anyway; listed so nothing rests on transitivity.
  - gitpython
  - toolz
  # xarray accelerators imported at call time, invisible to import smoke
  # tests. bottleneck is hard-required: pyCIAM's calc path uses ffill/bfill
  # (run.py:197-220,534), which raise without it. flox is the groupby
  # engine the hub had; without it the stage-6 aggregation falls back to a
  # much slower path. Consciously excluded: numbagg (clean fallback, drags
  # numba), cytoolz (pure micro-perf), netcdf4/h5netcdf (RCC stages touch
  # only zarr).
  - bottleneck
  - flox
  - pip
